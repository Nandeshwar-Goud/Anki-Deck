<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnkiFlow | Premium Flashcard Processor</title>
    <meta name="description" content="Process Anki .apkg files and study flashcards with a beautiful, modern interface directly in your browser.">
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>AnkiFlow</h1>
            <p class="subtitle">Premium Flashcard Experience</p>
        </header>

        <main id="main-content">
            <!-- Upload View -->
            <section id="upload-view" class="upload-container fade-in">
                <div class="loader" id="global-loader"></div>
                <div class="drop-zone" id="drop-zone">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                    <p>Drop your .apkg file here</p>
                    <span>or click to browse from your device</span>
                    <input type="file" id="file-input" accept=".apkg" style="display: none;">
                </div>
            </section>

            <!-- Study View -->
            <section id="study-view" class="study-container">
                <div class="progress-wrapper">
                    <div class="progress-info">
                        <span id="deck-name">Deck Name</span>
                        <span id="progress-text">0 / 0</span>
                    </div>
                    <div class="progress-bar">
                        <div id="progress-fill" class="progress-fill"></div>
                    </div>
                </div>

                <div class="flashcard-wrapper">
                    <div class="flashcard" id="flashcard">
                        <div class="card-face card-front">
                            <div class="card-content" id="card-front-content">
                                <!-- Question goes here -->
                            </div>
                        </div>
                        <div class="card-face card-back">
                            <div class="card-content" id="card-back-content">
                                <!-- Answer goes here -->
                            </div>
                        </div>
                    </div>
                </div>

                <div class="controls">
                    <button id="prev-btn" title="Previous (Left Arrow)">
                        <i class="fa-solid fa-chevron-left"></i> Prev
                    </button>
                    <button id="flip-btn" class="primary" title="Flip (Space)">
                        <i class="fa-solid fa-rotate"></i> Flip
                    </button>
                    <button id="next-btn" title="Next (Right Arrow)">
                        Next <i class="fa-solid fa-chevron-right"></i>
                    </button>
                </div>
                
                <button id="reset-btn" style="margin-top: 2rem; opacity: 0.7; font-size: 0.8rem;">
                    <i class="fa-solid fa-arrow-rotate-left"></i> Upload another deck
                </button>
            </section>
        </main>
    </div>

    <script type="module" src="/main.js"></script>
</body>
</html>
